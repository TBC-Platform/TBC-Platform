; SPDX-License-Identifier: MIT
; ---------------------------------------------------------------------------
; Wall-E firmware build configuration.
;
; Why the pioarduino platform fork and not the stock `espressif32`?
; ESP-SR (the offline wake-word engine) and the modern I2S driver both need
; Arduino-ESP32 core 3.x / ESP-IDF 5.x. The official PlatformIO platform is
; still on core 2.0.x, so the community fork is the supported route today.
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor
; OTA:     pio run -e walle-ota -t upload
; ---------------------------------------------------------------------------

[platformio]
default_envs = walle
src_dir = src
include_dir = include

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; 8 MB flash, 8 MB PSRAM. PSRAM is not optional: the camera frame buffer and
; the 4 second audio jitter buffer both live there.
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
    -I src
    ; -O2 rather than -Os: the audio path is tight and flash is not.
    -O2

build_unflags = -Os

lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    links2004/WebSockets @ ^2.6.1
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    madhephaestus/ESP32Servo @ ^3.0.5
    ; No esp32-camera entry: Arduino-ESP32 core 3.x bundles the OV2640 driver
    ; (esp_camera.h) in its precompiled ESP-IDF libraries, and there is no
    ; `espressif/esp32-camera` package in the PlatformIO registry to install.

[env:walle]
upload_speed = 921600

; Over-the-air upload. Set upload_port to whatever IP the robot printed on
; boot, and --auth to your WALLE_OTA_PASSWORD.
[env:walle-ota]
upload_protocol = espota
upload_port = 192.168.1.60
upload_flags =
    --auth=change-me-too

; Bring-up profile: no camera, no motors, push-to-talk instead of the wake
; word. Use this to prove the mic, speaker and Wi-Fi work before you solder
; anything else.
[env:walle-minimal]
build_flags =
    ${env.build_flags}
    -DWALLE_ENABLE_CAMERA=0
    -DWALLE_ENABLE_MOTORS=0
    -DWALLE_WAKEWORD_BACKEND=0
